server:
  port: 9095

spring:
  datasource:
    url: jdbc:mysql://${RESERVA_DB_HOST:mysql-reserva}:${RESERVA_DB_PORT:3306}/${RESERVA_DB_NAME:db_hotel_reservas}?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true
    username: ${RESERVA_DB_USERNAME:root}
    password: ${RESERVA_DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

eureka:
  client:
    service-url:
      defaultZone: http://registry-server:7081/eureka

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuitbreakers,circuitbreakerevents
  prometheus:
    metrics:
      export:
        enabled: true

jwt:
  secret: ${JWT_SECRET}
  issuer: auth
