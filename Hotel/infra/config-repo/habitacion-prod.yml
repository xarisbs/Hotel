server:
  port: 9091

spring:
  datasource:
    url: jdbc:mysql://${HABITACION_DB_HOST:mysql-habitacion}:${HABITACION_DB_PORT:3306}/${HABITACION_DB_NAME:db_hotel_habitaciones}?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true
    username: ${HABITACION_DB_USERNAME:root}
    password: ${HABITACION_DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

eureka:
  client:
    service-url:
      defaultZone: http://registry-server:7081/eureka

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuitbreakers,circuitbreakerevents
  prometheus:
    metrics:
      export:
        enabled: true

jwt:
  secret: ${JWT_SECRET}
  issuer: auth
