server:
  port: 9092

spring:
  datasource:
    url: jdbc:mysql://${CLIENTE_DB_HOST:mysql-cliente}:${CLIENTE_DB_PORT:3306}/${CLIENTE_DB_NAME:db_hotel_clientes}?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true
    username: ${CLIENTE_DB_USERNAME:root}
    password: ${CLIENTE_DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

eureka:
  client:
    service-url:
      defaultZone: http://registry-server:7081/eureka

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  prometheus:
    metrics:
      export:
        enabled: true

jwt:
  secret: ${JWT_SECRET}
  issuer: auth
