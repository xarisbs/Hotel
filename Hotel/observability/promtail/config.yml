server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: gateway-logs
    static_configs:
      - targets: [localhost]
        labels:
          job: gateway
          service: gateway
          __path__: /var/log/ms/gateway/*.log

  - job_name: habitacion-logs
    static_configs:
      - targets: [localhost]
        labels:
          job: habitacion
          service: habitacion
          __path__: /var/log/ms/habitacion/*.log

  - job_name: tipo-habitacion-logs
    static_configs:
      - targets: [localhost]
        labels:
          job: tipo-habitacion
          service: tipo-habitacion
          __path__: /var/log/ms/tipo-habitacion/*.log

  - job_name: auth-logs
    static_configs:
      - targets: [localhost]
        labels:
          job: auth
          service: auth
          __path__: /var/log/ms/auth/*.log

  - job_name: reserva-logs
    static_configs:
      - targets: [localhost]
        labels:
          job: reserva
          service: reserva
          __path__: /var/log/ms/reserva/*.log

  - job_name: facturacion-logs
    static_configs:
      - targets: [localhost]
        labels:
          job: facturacion
          service: facturacion
          __path__: /var/log/ms/facturacion/*.log

  - job_name: reportes-logs
    static_configs:
      - targets: [localhost]
        labels:
          job: reportes
          service: reportes
          __path__: /var/log/ms/reportes/*.log

  - job_name: cliente-logs
    static_configs:
      - targets: [localhost]
        labels:
          job: cliente
          service: cliente
          __path__: /var/log/ms/cliente/*.log
