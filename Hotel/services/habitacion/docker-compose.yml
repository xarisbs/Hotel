name: habitacion-prod

services:
  mysql-habitacion:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${HABITACION_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${HABITACION_MYSQL_DATABASE}
    ports:
      - "3391:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p${HABITACION_MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - mysql_habitacion_data:/var/lib/mysql
    networks:
      - habitacion-int

  habitacion:
    build: .
    restart: unless-stopped
    depends_on:
      mysql-habitacion:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      CONFIG_SERVER_URL: ${CONFIG_SERVER_URL}
      HABITACION_DB_HOST: ${HABITACION_DB_HOST}
      HABITACION_DB_PORT: ${HABITACION_DB_PORT}
      HABITACION_DB_NAME: ${HABITACION_DB_NAME}
      HABITACION_DB_USERNAME: ${HABITACION_DB_USERNAME}
      HABITACION_DB_PASSWORD: ${HABITACION_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "9091:9091"
    volumes:
      - ./logs:/app/logs
    networks:
      - habitacion-int
      - ms-net

volumes:
  mysql_habitacion_data:

networks:
  ms-net:
    external: true
    name: ms-net
  habitacion-int:
    name: habitacion-int
