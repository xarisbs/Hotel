name: reserva-dev

services:
  mysql-reserva-dev:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_hotel_reservas
    ports:
      - "3393:3306"
    volumes:
      - mysql_hotel_reservas_dev_data:/var/lib/mysql

volumes:
  mysql_hotel_reservas_dev_data:
