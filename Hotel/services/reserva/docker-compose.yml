name: reserva-prod

services:
  mysql-reserva:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${RESERVA_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${RESERVA_MYSQL_DATABASE}
    ports:
      - "3393:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p${RESERVA_MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - mysql_reserva_data:/var/lib/mysql
    networks:
      - reserva-int

  reserva:
    build: .
    restart: unless-stopped
    depends_on:
      mysql-reserva:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      CONFIG_SERVER_URL: ${CONFIG_SERVER_URL:-http://config-server:7071}
      RESERVA_DB_HOST: ${RESERVA_DB_HOST}
      RESERVA_DB_PORT: ${RESERVA_DB_PORT}
      RESERVA_DB_NAME: ${RESERVA_DB_NAME}
      RESERVA_DB_USERNAME: ${RESERVA_DB_USERNAME}
      RESERVA_DB_PASSWORD: ${RESERVA_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "9095:9095"
    networks:
      - reserva-int
      - ms-net

volumes:
  mysql_reserva_data:

networks:
  ms-net:
    external: true
    name: ms-net
  reserva-int:
    name: reserva-int
