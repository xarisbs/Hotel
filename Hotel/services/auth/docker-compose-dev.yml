name: auth-dev

services:
  mysql-auth-dev:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_hotel_auth
    ports:
      - "3341:3306"
    volumes:
      - mysql_hotel_auth_dev_data:/var/lib/mysql

volumes:
  mysql_hotel_auth_dev_data: