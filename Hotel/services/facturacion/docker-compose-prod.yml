name: facturacion-prod

services:
  mysql-facturacion:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${FACTURACION_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${FACTURACION_MYSQL_DATABASE}
    ports:
      - "3394:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p${FACTURACION_MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - mysql_facturacion_data:/var/lib/mysql
    networks:
      - facturacion-int

  facturacion:
    build: .
    restart: unless-stopped
    depends_on:
      mysql-facturacion:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      CONFIG_SERVER_URL: ${CONFIG_SERVER_URL}
      FACTURACION_DB_HOST: ${FACTURACION_DB_HOST}
      FACTURACION_DB_PORT: ${FACTURACION_DB_PORT}
      FACTURACION_DB_NAME: ${FACTURACION_DB_NAME}
      FACTURACION_DB_USERNAME: ${FACTURACION_DB_USERNAME}
      FACTURACION_DB_PASSWORD: ${FACTURACION_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "6060:6060"
    volumes:
      - ./logs:/app/logs
    networks:
      - facturacion-int
      - ms-net

volumes:
  mysql_facturacion_data:

networks:
  ms-net:
    external: true
    name: ms-net
  facturacion-int:
    name: facturacion-int
