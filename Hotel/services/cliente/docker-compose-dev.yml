name: cliente-dev

services:
  mysql-cliente-dev:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_hotel_clientes
    ports:
      - "3396:3306"
    volumes:
      - mysql_hotel_clientes_dev_data:/var/lib/mysql

volumes:
  mysql_hotel_clientes_dev_data:
